<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WabiSabi.jp Contact</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Walter+Turncoat&display=swap" rel="stylesheet">

    <!-- CSS Link -->
    <link rel = 'stylesheet' href = '../assets/cs/styles.css' defer>

</head>
<body>
    <!-- JS Link -->
    <script src = '../assets/js/script.js' defer></script>

    <!-- Navigations -->
    <header>

        <!-- === Visible Menu === -->
        <nav class = 'top-nav'>
            <!-- Left -->
            <button id = 'hamburger-btn' class = 'hamburger-btn'>&#x2630;</button>

            <!-- Middle -->
            <a href = '../index.html'>
                <img class = 'logo-img' src = '../assets/media/wabisabi_logo_white.png' alt = 'WABI SABI JP'>
            </a>


            <!-- Right -->
            <!-- [Future Checkout Button?] -->
        </nav>

        <nav class = 'bottom-nav'>
            <a class = 'nav-link home' href = '../index.html'>Home</a>
            <a class = 'nav-link products' href = 'products.html'>Products</a>
            <a class = 'nav-link contact' href = 'contact.html'>Contact</a>
        </nav>

        <!-- === Hidden Left Menu === -->
        <!-- Overlay to allow user to click outside menu to close -->
        <div id = 'nav-overlay' class = 'nav-overlay'></div>

        <nav id = 'hidden-nav' class = 'hidden-nav'>
            <!-- Exit Button -->
            <button id = 'nav-close-btn'>&times;</button>

            <!-- Page Links -->
            <a class = 'nav-link home' href = '../index.html'>Home</a>
            <a class = 'nav-link products' href = 'products.html'>Products</a>
            <a class = 'nav-link contact' href = 'contact.html'>Contact</a>
        </nav>

    </header>

    <!-- Main Content -->
    <main>
        <h2 class = 'page-title'>Contact</h2>
        <p class = 'page-desc'>Have a question or inquiry? Contact us here through this form!</p>

        <section class = 'contact-section'>
            <form id = 'contact-form'>
                <!-- Name -->
                <label for = 'name'>Name: </label>
                <input type = 'text' id = 'name-input' name = 'name' required>

                <!-- Email -->
                <label for = 'email'>Email: </label>
                <input type = 'text' id = 'email-input' name = 'email' required>

                <!-- Message -->
                <label for = 'message'>Message: </label>
                <textarea id = 'message-input' name = 'message' required></textarea>

                <!-- Validation Message -->
                <div id = 'validation-message'></div> 

                <!-- Submit -->
                <button class = 'submit-btn' type = 'submit'>Submit</button>

            </form>
        </section>

        <!-- Thank You Message -->
        <section id = 'thankyou-section' class = 'thankyou-section'>
            <h3> Your form has been submitted successfully. Thank You!</h3>
            <p>From our team at,</p>
            <img src = '../assets/media/wabisabi_title_white.png' alt="WabiSabi.jp">
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <!-- Left -->
        <a class = 'footer-home' href = '../index.html'>
            <img class = 'logo-img footer' src = '../assets/media/wabisabi_title_white.png' alt = 'WABI SABI JP'>
        </a>

        <!-- Middle -->
        <section class = 'footer-pages'>
            <h2>- Pages -</h2>
            <a class = 'nav-link home' href = '../index.html'>Home</a>
            <a class = 'nav-link products' href = 'products.html'>Products</a>
            <a class = 'nav-link contact' href = 'contact.html'>Contact</a>
        </section>

        <!-- Right -->
        <section>
            <h2>- Socials -</h2>
            <div class = 'social-logo'>
                <a class = 'instagram' href = 'https://www.instagram.com/' target = '_blank'>
                    <img class = 'instagram-img' src = '../assets/media/Instagram.png' alt = 'Instagram'>
                </a>
            </div>
        </section>

        <!-- Bottom -->
        <p class = 'copyright-message'>&copy; WabiSabi.jp</p>

    </footer>
    
</body>
</html>
